[project]
name = "fastapi-online-cinema"
version = "0.1.0"
description = "Online cinema API with authentication, movie catalog, comments and favorites."
authors = [
    {name = "Sabina Gamidova",email = "sabina.gamidova.dev@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.142.0,<0.143.0)",
    "sqlalchemy (>=2.1.1,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "bcrypt (==4.0.1)",
    "validators (>=0.35.0,<0.36.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "aiosmtplib (>=5.1.3,<6.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-env (>=1.7.1,<2.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "pytest-order (>=1.5.0,<2.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
